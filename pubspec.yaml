name: focusflow
description: FocusFlow - Premium Study Timer & Productivity App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # UI & Animation
  cupertino_icons: ^1.0.8
  flutter_staggered_animations: ^1.1.1

  # State Management
  provider: ^6.1.1

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.3

  # Charts - Use 1.2.0 with override
  fl_chart: ^1.2.0

  # Utilities
  intl: ^0.19.0
  uuid: ^4.3.3
  path_provider: ^2.1.2

  # File Operations
  file_picker: ^8.1.4
  share_plus: ^10.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.0
  hive_generator: ^2.0.0

# Add this to fix vector_math compatibility
dependency_overrides:
  vector_math: 2.2.0

flutter:
  uses-material-design: true