name: focusflow
description: FocusFlow - Premium Study Timer & Productivity App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"  # ← was >=3.4.0; fl_chart 1.x requires 3.6+

dependencies:
  flutter:
    sdk: flutter

  # UI & Animation
  cupertino_icons: ^1.0.8
  flutter_staggered_animations: ^1.1.1  # ✅ latest, no change needed

  # State Management
  provider: ^6.1.1  # ✅ fine

  # Local Storage
  hive: ^2.2.3        # ✅ latest stable (unmaintained but still works)
  hive_flutter: ^1.1.0  # ✅ latest stable
  shared_preferences: ^2.2.3  # ✅ fine

  # Charts
  fl_chart: ^1.2.0   # ← was ^0.66.0 — this is TWO major versions behind!
                      # 1.x requires Dart >=3.6, has breaking API changes

  # Utilities
  intl: ^0.19.0      # ✅ fine
  uuid: ^4.3.3       # ✅ fine
  path_provider: ^2.1.2  # ✅ fine

  # File Operations
  file_picker: ^9.0.0   # ← was ^6.1.1; v12 is latest but has MAJOR breaking
                         # changes (federated arch, FilePickerResult removed).
                         # ^9.0.0 is the safest upgrade with minimal breakage.
  share_plus: ^13.0.0   # ← was ^7.2.2; current latest is 13.x.
                         # v10+ changed to SharePlus.instance.share(ShareParams())
                         # — the old Share.shareXFiles() API is gone.

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.0
  hive_generator: ^2.0.0

flutter:
  uses-material-design: true