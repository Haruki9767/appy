name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        # FIX: was actions/checkout@v4 — current latest stable is v6
        uses: actions/checkout@v6

      - name: Set up Java
        # FIX: was actions/setup-java@v4 — v4 is deprecated; v5 is latest stable.
        # FIX: was java-version 17 — Flutter 3.44 / Gradle 8.x requires Java 21.
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # FIX: was '3.27.0' — current stable is 3.44.0 (released May 2026).
          # Pinning to a specific patch avoids unexpected breakage mid-project.
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Clean and prepare
        run: |
          flutter clean
          rm -f pubspec.lock

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Hive adapters
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze (catch errors before building)
        # FIX: added — catches type errors and missing imports without waiting
        # for the full APK build to fail 3+ minutes in.
        run: flutter analyze --no-fatal-infos

      - name: Build APK (release)
        run: flutter build apk --release --split-per-abi

      - name: Upload APK
        # FIX: was actions/upload-artifact@v4 — current latest is v6 (Node 24).
        uses: actions/upload-artifact@v6
        with:
          name: focusflow-apk
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30
